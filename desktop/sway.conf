# Project Friday: Sway integration. install.sh adds `include <this file>` to ~/.config/sway/config.
# Super+Alt keys so nothing collides with Sway's defaults (Super+Space is focus mode_toggle there).
bindsym Mod4+Mod1+space exec ~/.local/share/friday/bin/friday-toggle
bindsym Mod4+Mod1+Shift+space exec ~/.local/share/friday/bin/friday-toggle --selection
bindsym Mod4+Mod1+Ctrl+space exec qs -c friday ipc call friday listen
exec ~/.local/share/friday/bin/friday-start
exec ~/.local/share/friday/bin/friday-profile --if-stale
