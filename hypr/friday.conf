# Project Friday: Hyprland integration.
# install.sh sources this file from ~/.config/hypr/custom/rules.conf (custom files load after the
# illogical-impulse defaults, so these rules win). Nothing in hypr/hyprland/ is ever touched.

# ---- keys
bindd = Super, Space, Friday, exec, ~/.local/share/friday/bin/friday-toggle # Summon Friday
bindd = Super+Ctrl, Space, Talk to Friday, exec, qs -c friday ipc call friday listen # Push-to-talk (or just say "Hey Friday")
bindd = Super+Shift, Space, Friday on selection, exec, ~/.local/share/friday/bin/friday-toggle --selection # Explain / rewrite highlighted text

# ---- start with the session
exec-once = ~/.local/share/friday/bin/friday-start   # starts Friday and restarts it if it ever crashes
exec-once = ~/.local/share/friday/bin/friday-integrate --quiet
exec-once = ~/.local/share/friday/bin/friday-profile --if-stale

# ---- glass
# Inherit illogical-impulse's quickshell:* blur, but only frost the card itself:
# the 45% dim (plus the shadow on top of it, ~0.62) stays below ignore_alpha, so the screen behind is
# darkened but sharp; only the card (~0.9) gets frosted.
layerrule = match:namespace quickshell:friday, blur on
layerrule = match:namespace quickshell:friday, xray off
layerrule = match:namespace quickshell:friday, ignore_alpha 0.7
layerrule = match:namespace quickshell:friday, no_anim on
